name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    env:
      PYTHONPATH: .:./app/db
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install fastapi uvicorn duckdb pandas pytest pytest-cov

      - name: Generate sample data
        run: |
          python ../../scripts/seed_demo.py --rows 50000 --out data/sample_data.csv

      - name: Run tests
        run: |
          PYTHONPATH=.:./app/db pytest tests/ -v

      - name: Run type-check
        run: |
          python -c "import duckdb_database; print('Import OK')"