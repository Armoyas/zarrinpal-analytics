name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify app imports
        run: python -c "from app.main import app; print('FastAPI app OK')"
      - name: Run tests (if present)
        run: |
          if [ -d tests ]; then pytest tests -q; else echo 'No tests yet — skipping'; fi

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install dependencies
        run: npm ci || npm install
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  data-pipeline:
    name: Data pipeline (DuckDB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/data-processing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate sample data + ingest + process
        run: |
          python ../../scripts/seed_demo.py --rows 5000 --out /tmp/sample.csv
          python ingest.py --csv /tmp/sample.csv --db /tmp/test.duckdb
          python process.py --db /tmp/test.duckdb
