services:
  # ─────────────────────────────────────────────
  # Development override — hot reload, debug mode
  # ─────────────────────────────────────────────
  api:
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - DEBUG=true
    volumes:
      - type: bind
        source: ./services/api
        target: /app
        consistency: cached
      - type: bind
        source: ./data/sample_data.csv
        target: /app/data/sample_data.csv
        read_only: true

  frontend:
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000/api/v1
      - NODE_ENV=development
    volumes:
      - type: bind
        source: ./frontend
        target: /app
        consistency: cached
      - /app/node_modules
