name: analytical-dashboard
services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: zp-api
    ports:
      - "8000:8000"
    environment:
      - DATA_FILE=/app/data/sample_data.csv
      - DUCKDB_PATH=/app/data/analytics.duckdb
      - DEBUG=false
    volumes:
      - ./data:/app/data:ro
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: zp-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    command: sh -c "npm install && npx serve -s ."
    depends_on:
      - api
    restart: unless-stopped
